{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teams-lite.serviceAccountName" . }}
  labels:
    {{- include "teams-lite.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in the pod talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
