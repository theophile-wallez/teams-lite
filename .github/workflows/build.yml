name: build

# Build the single `teams` binary on every push to master and publish it as a
# rolling "latest" GitHub release, so `install.sh` can always fetch the newest
# build. Tests run first as a hard gate — a red suite blocks the release.
#
# TWO RELEASES COME OUT OF EVERY BUILD, and each answers something the other cannot:
#
#   • `build-<shortsha>` — immutable, one per commit, kept FOR EVER. It is the record of
#     what shipped and when, and its body is the changelog of that build. Nothing ever
#     rewrites it, so a release page linked from anywhere still says what it said.
#   • `latest` — the rolling tag, recreated here every time. It is what install.sh
#     downloads from and what a RUNNING build asks about (`src/update.rs` reads
#     /releases/tags/latest), so it can never move to another name without leaving every
#     installed copy unable to see an update again.
#
# The asset is therefore uploaded twice, deliberately: `latest` needs it because that URL
# is the app's own, and the immutable release needs it so a build can be rolled BACK to.
#
# THE BINARY IS KEPT ON THE NEWEST `ASSET_WINDOW` BUILDS ONLY. It is 134 MB and this
# project pushes about 19 times a day, so keeping every one would cost some 78 GB a month
# to no purpose. Older releases keep their notes — the changelog history is the part worth
# for ever, and it is a few KB.
#
# THE CHANGELOG IS NOT WRITTEN HERE. `src/changelog.rs` groups the commit subjects and
# renders the markdown, and examples/changelog.rs is the one line of glue, because the
# same module builds the list the update button shows on hover: an awk pipeline here
# beside a grouper in Rust would be two spellings of one list.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-latest
  cancel-in-progress: true

env:
  # How many of the newest builds keep their 134 MB binary. Ten is about half a day of
  # pushes here — enough to roll back to a build the user was actually running, and flat at
  # some 1.3 GB. Older releases keep their changelog and lose the download.
  ASSET_WINDOW: "10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the release notes are `git log` between the build the users
          # are on and this one, and a shallow clone cannot answer that.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # --- gate: deterministic tests must pass before we publish anything ---
      - name: Backend tests
        run: cargo test

      - name: Launcher tests
        working-directory: launcher
        run: bun test

      # The web client's tests are fully deterministic (pure logic + a fake
      # WebSocket), so the whole suite runs in CI, plus a typecheck gate.
      - name: Web tests
        working-directory: web
        run: bun run test

      - name: Web typecheck
        working-directory: web
        run: bun run typecheck

      # --- build the single self-contained binary ---
      - name: Build backend (release)
        # Embed the commit this binary is built from so the running app can tell
        # whether a newer rolling `latest` release exists (see src/update.rs).
        env:
          TEAMS_BUILD_REV: ${{ github.sha }}
        run: cargo build --release --bin server

      - name: Compile single `teams` binary
        # build.ts also builds the web app and embeds it, so the published binary
        # needs nothing else to serve it (web deps were installed above).
        working-directory: launcher
        run: bun run build.ts

      - name: Stage release asset
        run: |
          mkdir -p out
          cp launcher/dist/teams out/teams-linux-x64

      # --- the release notes: what this build changes, for both releases ---
      - name: Write the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # WHERE THE READER IS COMING FROM is the build they are running, and TWO releases
          # answer that — neither alone. `latest` is the honest one: it is what every
          # installed copy asks about. But it is a ROLLING tag recreated at the end of this
          # job, so two pushes a minute apart race on it: the second job read `latest` before
          # the first recreated it, and its release page then re-listed a change the previous
          # page had already stated (build-218bd7b repeated build-c40f8d8's own entry). The
          # immutable `build-*` release is published BEFORE the tag is recreated, so it names
          # the newer commit exactly when the race loses it.
          #
          # So both are candidates, and ANCESTRY picks: the base must be behind this build,
          # and of those the CLOSEST one is the truth about what this build adds.
          #
          # The newest build tags, not just THE newest: a build tag names a commit on
          # whatever line it was built from, so the newest one is not always behind this
          # build (measured: build-13bf909 is not an ancestor of build-218bd7b). One
          # candidate would be dropped by the ancestry check with nothing to fall back on.
          candidates="$(gh release view latest --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          candidates="$candidates $(git for-each-ref --sort=-creatordate --count=10 --format='%(refname:short)' 'refs/tags/build-*')"

          base=""
          nearest=""
          for candidate in $candidates; do
            # A commit this clone does not hold: a deleted release, or a force-pushed history.
            git cat-file -e "${candidate}^{commit}" 2>/dev/null || continue
            resolved="$(git rev-parse "${candidate}^{commit}")"
            # Not an ANCESTOR means the range would name commits this build does not hold.
            if ! git merge-base --is-ancestor "$resolved" "$GITHUB_SHA"; then
              continue
            fi
            behind="$(git rev-list --count "${resolved}..${GITHUB_SHA}")"
            # Zero is this very commit, which would render "No changes." over a real build.
            if [ "$behind" -eq 0 ]; then
              continue
            fi
            if [ -z "$nearest" ] || [ "$behind" -lt "$nearest" ]; then
              nearest="$behind"
              base="$resolved"
            fi
          done
          # A first run, or no candidate behind us: the parent, so a build always states at
          # least its own change.
          if [ -z "$base" ]; then
            base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || echo "${GITHUB_SHA}")"
          fi
          echo "changelog base: $base"

          mkdir -p out
          # The FIRST line is the machine-readable one, and it must stay first: src/update.rs
          # reads the commit back out of the notes when GitHub resolves `target_commitish` to
          # a branch name, by taking the first 40-character hex run in the body.
          #
          # `-z` and `%b` are the release notes' own content: a commit here carries a subject
          # and then the paragraphs saying what was wrong before and what the change costs,
          # which is most of what this page has to say. NUL separates the records because a
          # newline cannot — it is inside every message.
          {
            echo "Rolling build from ${GITHUB_SHA} — $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            git log -z --no-merges --pretty=format:%s%n%b "${base}..${GITHUB_SHA}" \
              | cargo run --quiet --example changelog
          } > out/notes.md
          cat out/notes.md

      - name: Publish this build's own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Immutable, and kept for ever: this is the record of what shipped. `--latest`
          # marks it as the repository's current release, so the Releases page opens on a
          # real build rather than on the rolling pointer.
          tag="build-$(git rev-parse --short=7 "${GITHUB_SHA}")"
          gh release create "$tag" out/teams-linux-x64 \
            --title "teams-lite — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes-file out/notes.md \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recreate the rolling tag so `latest` always points at this commit. It carries the
          # same asset and the same notes: every installed build asks this tag about updates,
          # so it can never become a pointer to somewhere else.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/teams-linux-x64 \
            --title "teams-lite (latest)" \
            --notes-file out/notes.md \
            --target "${GITHUB_SHA}" \
            --latest=false

      - name: Keep the binary on the newest builds only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The notes are kept for ever; the 134 MB download is kept on the newest
          # ASSET_WINDOW builds. The API answers newest first, so everything past the window
          # loses its assets and keeps its page. `--paginate`, because after a month there
          # are more releases than one page holds and the older ones must still be reached.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name | startswith("build-")) | .tag_name' \
            | tail -n "+$((ASSET_WINDOW + 1))" \
            | while read -r tag; do
                gh release view "$tag" --json assets --jq '.assets[].name' \
                  | while read -r asset; do
                      echo "pruning $asset from $tag"
                      gh release delete-asset "$tag" "$asset" --yes
                    done
              done
