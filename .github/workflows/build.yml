name: build

# Build the single `teams` binary on every push to master and publish it as a
# rolling "latest" GitHub release, so `install.sh` can always fetch the newest
# build. Tests run first as a hard gate — a red suite blocks the release.
#
# TWO RELEASES COME OUT OF EVERY BUILD, and each answers something the other cannot:
#
#   • `build-<shortsha>` — immutable, one per commit, kept FOR EVER. It is the record of
#     what shipped and when, and its body is the changelog of that build. Nothing ever
#     rewrites it, so a release page linked from anywhere still says what it said.
#   • `latest` — the rolling tag, recreated here every time. It is what install.sh
#     downloads from and what a RUNNING build asks about (`src/update.rs` reads
#     /releases/tags/latest), so it can never move to another name without leaving every
#     installed copy unable to see an update again.
#
# The asset is therefore uploaded twice, deliberately: `latest` needs it because that URL
# is the app's own, and the immutable release needs it so a build can be rolled BACK to.
#
# THE BINARY IS KEPT ON THE NEWEST `ASSET_WINDOW` BUILDS ONLY. It is 134 MB and this
# project pushes about 19 times a day, so keeping every one would cost some 78 GB a month
# to no purpose. Older releases keep their notes — the changelog history is the part worth
# for ever, and it is a few KB.
#
# AND THE SAME BUILD IS PUBLISHED FOR CONTAINERS, after the same gate (the `image`, `chart-check`
# and `chart` jobs below): the container image to ghcr.io/<owner>/<repo>, tagged
# `build-<shortsha>` — the name of the GitHub release built from the same commit — and `latest`;
# and the Helm chart to oci://ghcr.io/<owner>/charts/teams-lite, whose appVersion is that tag, so
# a chart version runs exactly the image built beside it. Every name comes from the repository
# this runs in, never from a spelling in the tree: a fork's master publishes under the fork's own
# owner, and its chart runs the fork's image (packaging/helm/package.sh). See AGENTS.md § Running
# teams-lite on Kubernetes.
#
# THE CHANGELOG IS NOT WRITTEN HERE. `src/changelog.rs` groups the commit subjects and
# renders the markdown, and examples/changelog.rs is the one line of glue, because the
# same module builds the list the update button shows on hover: an awk pipeline here
# beside a grouper in Rust would be two spellings of one list.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

# CONCURRENCY IS PER JOB, not per workflow. A newer push still cancels an older `build` — the
# release it would publish is superseded anyway — but once a commit's image or chart has STARTED
# publishing it finishes: cancelled mid-way, the commit would keep a `build-<sha>` release with no
# image and no chart. A publish queued behind a running one is replaced by the newest commit's, so
# the order stays serial and an older build can never overwrite `latest`.

env:
  # How many of the newest builds keep their 134 MB binary. Ten is about half a day of
  # pushes here — enough to roll back to a build the user was actually running, and flat at
  # some 1.3 GB. Older releases keep their changelog and lose the download.
  ASSET_WINDOW: "10"

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-latest
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.rev.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the release notes are `git log` between the build the users
          # are on and this one, and a shallow clone cannot answer that.
          fetch-depth: 0

      # The build's ONE name: this commit's release, and the tag of the image and the appVersion
      # of the chart built from it. `--short=7` grows past 7 on a collision in the full history,
      # which is exactly why the image job reads it from here rather than cutting the sha itself.
      - name: Name this build
        id: rev
        run: echo "tag=build-$(git rev-parse --short=7 "${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # --- gate: deterministic tests must pass before we publish anything ---
      - name: Backend tests
        run: cargo test

      - name: Launcher tests
        working-directory: launcher
        run: bun test

      # The web client's tests are fully deterministic (pure logic + a fake
      # WebSocket), so the whole suite runs in CI, plus a typecheck gate.
      - name: Web tests
        working-directory: web
        run: bun run test

      - name: Web typecheck
        working-directory: web
        run: bun run typecheck

      # --- build the single self-contained binary ---
      - name: Build backend (release)
        # Embed the commit this binary is built from so the running app can tell
        # whether a newer rolling `latest` release exists (see src/update.rs).
        env:
          TEAMS_BUILD_REV: ${{ github.sha }}
        run: cargo build --release --bin server

      - name: Compile single `teams` binary
        # build.ts also builds the web app and embeds it, so the published binary
        # needs nothing else to serve it (web deps were installed above).
        working-directory: launcher
        run: bun run build.ts

      - name: Stage release asset
        run: |
          mkdir -p out
          cp launcher/dist/teams out/teams-linux-x64

      # --- the release notes: what this build changes, for both releases ---
      - name: Write the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # WHERE THE READER IS COMING FROM is the build they are running, and TWO releases
          # answer that — neither alone. `latest` is the honest one: it is what every
          # installed copy asks about. But it is a ROLLING tag recreated at the end of this
          # job, so two pushes a minute apart race on it: the second job read `latest` before
          # the first recreated it, and its release page then re-listed a change the previous
          # page had already stated (build-218bd7b repeated build-c40f8d8's own entry). The
          # immutable `build-*` release is published BEFORE the tag is recreated, so it names
          # the newer commit exactly when the race loses it.
          #
          # So both are candidates, and ANCESTRY picks: the base must be behind this build,
          # and of those the CLOSEST one is the truth about what this build adds.
          #
          # The newest build tags, not just THE newest: a build tag names a commit on
          # whatever line it was built from, so the newest one is not always behind this
          # build (measured: build-13bf909 is not an ancestor of build-218bd7b). One
          # candidate would be dropped by the ancestry check with nothing to fall back on.
          candidates="$(gh release view latest --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          candidates="$candidates $(git for-each-ref --sort=-creatordate --count=10 --format='%(refname:short)' 'refs/tags/build-*')"

          base=""
          nearest=""
          for candidate in $candidates; do
            # A commit this clone does not hold: a deleted release, or a force-pushed history.
            git cat-file -e "${candidate}^{commit}" 2>/dev/null || continue
            resolved="$(git rev-parse "${candidate}^{commit}")"
            # Not an ANCESTOR means the range would name commits this build does not hold.
            if ! git merge-base --is-ancestor "$resolved" "$GITHUB_SHA"; then
              continue
            fi
            behind="$(git rev-list --count "${resolved}..${GITHUB_SHA}")"
            # Zero is this very commit, which would render "No changes." over a real build.
            if [ "$behind" -eq 0 ]; then
              continue
            fi
            if [ -z "$nearest" ] || [ "$behind" -lt "$nearest" ]; then
              nearest="$behind"
              base="$resolved"
            fi
          done
          # A first run, or no candidate behind us: the parent, so a build always states at
          # least its own change.
          if [ -z "$base" ]; then
            base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || echo "${GITHUB_SHA}")"
          fi
          echo "changelog base: $base"

          mkdir -p out
          # The FIRST line is the machine-readable one, and it must stay first: src/update.rs
          # reads the commit back out of the notes when GitHub resolves `target_commitish` to
          # a branch name, by taking the first 40-character hex run in the body.
          #
          # `-z` and `%b` are the release notes' own content: a commit here carries a subject
          # and then the paragraphs saying what was wrong before and what the change costs,
          # which is most of what this page has to say. NUL separates the records because a
          # newline cannot — it is inside every message.
          {
            echo "Rolling build from ${GITHUB_SHA} — $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            git log -z --no-merges --pretty=format:%s%n%b "${base}..${GITHUB_SHA}" \
              | cargo run --quiet --example changelog
          } > out/notes.md
          cat out/notes.md

      - name: Publish this build's own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Immutable, and kept for ever: this is the record of what shipped. `--latest`
          # marks it as the repository's current release, so the Releases page opens on a
          # real build rather than on the rolling pointer.
          tag="${{ steps.rev.outputs.tag }}"
          gh release create "$tag" out/teams-linux-x64 \
            --title "teams-lite — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes-file out/notes.md \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recreate the rolling tag so `latest` always points at this commit. It carries the
          # same asset and the same notes: every installed build asks this tag about updates,
          # so it can never become a pointer to somewhere else.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/teams-linux-x64 \
            --title "teams-lite (latest)" \
            --notes-file out/notes.md \
            --target "${GITHUB_SHA}" \
            --latest=false

          # AND THEN PROVE IT IS READABLE, because a release that is not is invisible to every
          # installed build and this step reported success while shipping one.
          #
          # Measured on run 33686205734 (2026-09-02): `gh release create` printed the release's
          # URL, exited 0, attached the right asset at the right commit — and left the release a
          # DRAFT, whose download URL was `…/releases/download/untagged-8466ea76ec15…/`. The
          # `--cleanup-tag` above and the create below both write `refs/tags/latest`, so a create
          # that lands before the delete has propagated has no tag to hang on and GitHub keeps
          # it unpublished. The git tag then existed and the release did not.
          #
          # A draft is absent from `GET /releases/tags/latest`, authenticated or not — which is
          # exactly the request `update::check` makes and the URL `install.sh` downloads from. So
          # the app said "Could not reach GitHub — 404 Not Found" and every install stopped being
          # able to update, while this workflow was green.
          #
          # `--draft=false` is idempotent on a release that is already published, so this costs a
          # request in the ordinary case and repairs the race in the rare one. The check after it
          # is the app's OWN question rather than a restatement of it: under `set -e` a 404 fails
          # the job, so a release nobody can read can never again be reported as a build that
          # shipped. It retries, because publishing propagates in a second or two and a spurious
          # red build teaches its reader to ignore this step.
          gh release edit latest --draft=false
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.tag_name' >/dev/null 2>&1; then
              echo "latest is published and readable"
              exit 0
            fi
            echo "latest not readable yet (attempt ${attempt})"
            sleep 3
          done
          echo "::error::the rolling \`latest\` release is not readable — every install's update check would 404"
          exit 1

      - name: Keep the binary on the newest builds only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The notes are kept for ever; the 134 MB download is kept on the newest
          # ASSET_WINDOW builds. The API answers newest first, so everything past the window
          # loses its assets and keeps its page. `--paginate`, because after a month there
          # are more releases than one page holds and the older ones must still be reached.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name | startswith("build-")) | .tag_name' \
            | tail -n "+$((ASSET_WINDOW + 1))" \
            | while read -r tag; do
                gh release view "$tag" --json assets --jq '.assets[].name' \
                  | while read -r asset; do
                      echo "pruning $asset from $tag"
                      gh release delete-asset "$tag" "$asset" --yes
                    done
              done

  # --- the container image -----------------------------------------------------------------
  # Built FROM SOURCE by packaging/docker/Dockerfile, the file a local `docker compose build`
  # runs, rather than from the binary the job above compiled: that one links this runner's glibc
  # and the image's runtime is Debian's, and the Dockerfile's two stages share one release by
  # construction. The cost is a cold cargo build here — BuildKit's cache mounts do not survive
  # between runs — which is why it runs after the gate and not beside it: nothing is published
  # for a build the tests refused.
  #
  # linux/amd64 only: Microsoft's identity broker, which the image cannot sign in without, ships
  # for x86_64 alone. Built for uid 1000 (see the Dockerfile's header).
  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: publish-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The names, handed to the chart job below: the repository this runs in (so a fork
      # publishes its own), lowercased because GHCR requires it, and the build job's own name for
      # this commit — the release's tag.
      - name: Name the image
        id: names
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=${{ steps.names.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=teams-lite
            org.opencontainers.image.description=A Microsoft Teams client for Linux that boots its own Intune container, or signs in through the host's identity broker

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          # TEAMS_BUILD_REV is what lets the running app say when `latest` moved past it.
          build-args: |
            UID=1000
            GID=1000
            TEAMS_BUILD_REV=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The runtime layers (Debian, tini, the user) are what a cache can keep: everything in
          # the build stage follows `COPY . .` and changes on every commit.
          cache-from: type=gha,scope=teams-lite-image
          cache-to: type=gha,mode=min,scope=teams-lite-image

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            echo "\`${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}\` (also \`latest\`)"
            echo
            echo "digest \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- the Helm chart ----------------------------------------------------------------------------
  # Checked in a job of its own, with no write permission: packaging/helm/check.sh downloads a
  # validator, and nothing downloaded should run beside a token that can publish packages.
  chart-check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Lint, test and validate the chart
        run: packaging/helm/check.sh

  # Published only once the image it names exists. Every build is a new chart version —
  # MAJOR.MINOR from Chart.yaml, the patch this workflow's run number — so `helm upgrade` always
  # has the newest build to move to, and its appVersion is the image tag above.
  chart:
    needs: [image, chart-check]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-chart
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2
      - name: Package and push the chart
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="$(awk '/^version:/ { print $2; exit }' packaging/helm/teams-lite/Chart.yaml)"
          version="${base%.*}.${GITHUB_RUN_NUMBER}"
          # Stamped for THIS repository: its image, its home, its sources (see the script's header).
          packaging/helm/package.sh "$GITHUB_REPOSITORY" "$version" "$IMAGE_TAG" out
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "out/teams-lite-${version}.tgz" "oci://ghcr.io/${owner}/charts"
          {
            echo "### Helm chart"
            echo
            echo "\`oci://ghcr.io/${owner}/charts/teams-lite\` version \`${version}\`, running \`${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
