[package]
name = "teams-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
# `process` is here for exactly one caller: `Ctx::start_broker_repair` asks systemd to
# run the broker repair unit. It is the only process this crate ever spawns.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process"] }
# rustls-tls => no system openssl dependency, portable static binary
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# D-Bus client to talk to the Microsoft Identity Broker
zbus = { version = "5", default-features = false, features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# html5ever-based sanitizer for mail bodies (see src/mail_html.rs). A mail body is
# a foreign document: it is reduced to an inert, self-contained fragment before it
# ever reaches a browser.
ammonia = "4"
flate2 = "1.1.9"
# Web Push (see src/push.rs). Pure Rust, like rustls above: the binary stays
# portable and links no system openssl. P-256 covers both halves of the standard —
# ECDH for the RFC 8291 payload encryption and ECDSA for the RFC 8292 VAPID token.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# SHA-1, for exactly one caller: a GitLab line code is
# `SHA1(<file path>)_<old line>_<new line>` (see `gitlab_mr_write::line_code`), which is how
# a comment names the two ends of a range of diff lines. It is an identifier GitLab's own
# schema spells that way, never a security primitive — and it shares the `digest` traits
# `sha2` above already brings in, so it adds no tree of its own.
sha1 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# Local wall-clock time, for exactly one caller: the hours "Always available" keeps
# (`teams_presence::local_minute_of_day`). Everything else here is epoch ms or ISO-8601
# UTC and needs no calendar — but "green from 08:00 to 19:00" is the user's OWN morning,
# and resolving that means the machine's time zone with its DST rules. `clock` is the one
# feature asked for (no serde, no oldtime): a stored UTC offset would be an hour wrong for
# half the year, which is exactly the size of mistake that setting exists to avoid.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The IANA time-zone database, for the same one caller: the hours are the USER's own
# morning, and the user travels while the machine they run this on does not (see
# `teams_presence::minute_of_day`). `chrono::Local` answers only "this machine's zone",
# which is the wrong answer for somebody who set 08:00-19:00 in Paris and is now in Tokyo.
chrono-tz = "0.10"
# X11, for exactly one feature: bringing the identity broker's own sign-in window to the
# browser this app is read in (see SIGN-IN.md and `src/xwindow.rs`). The broker renders that
# window itself, in a WebKitGTK view on an X display, and no API redirects it — so reaching
# it means reading one window's pixels and sending keys and clicks back, which is `xtest`.
# Pure Rust, like `rustls` and `p256` above: the binary links no system Xlib and stays
# portable, and nothing here spawns `xdotool`, `scrot`, `x11vnc` or `websockify` — the four
# binaries the same job took by hand.
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
# `test-util` is tokio's paused clock, and it is here for one rule: the agent stops a
# run that says nothing for half an hour (`agent::RUN_IDLE_TIMEOUT`). A test that waited
# for that in real time is a test nobody runs, so the two tests around it advance a
# virtual clock instead. Dev-only, so the shipped binary carries none of it.
tokio = { version = "1", features = ["test-util"] }
