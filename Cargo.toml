[package]
name = "teams-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
# `process` is here for exactly two callers, and only one of them runs another program. The local
# agent runs its CLI (`agent::run_once`) — the only HOST program this crate ever spawns: the
# broker repair used to be a second (`systemctl`), and on a host it is a D-Bus call now (see
# `intune::start_repair_unit`). The other is `intune_embedded::spawn_helper`, in the image's
# self-contained mode, and what it spawns is THIS binary again with one hidden argument — the
# boot, the repair or the enrollment's portal helper, in a session of its own — never anything
# else, which a test in that module pins (`the_only_program_a_helper_spawn_runs_is_this_binary`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process"] }
# rustls-tls => no system openssl dependency, portable static binary
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# D-Bus client to talk to the Microsoft Identity Broker
zbus = { version = "5", default-features = false, features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# html5ever-based sanitizer for mail bodies (see src/mail_html.rs). A mail body is
# a foreign document: it is reduced to an inert, self-contained fragment before it
# ever reaches a browser.
ammonia = "4"
flate2 = "1.1.9"
# Web Push (see src/push.rs). Pure Rust, like rustls above: the binary stays
# portable and links no system openssl. P-256 covers both halves of the standard —
# ECDH for the RFC 8291 payload encryption and ECDSA for the RFC 8292 VAPID token.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# SHA-1, for exactly one caller: a GitLab line code is
# `SHA1(<file path>)_<old line>_<new line>` (see `gitlab_mr_write::line_code`), which is how
# a comment names the two ends of a range of diff lines. It is an identifier GitLab's own
# schema spells that way, never a security primitive — and it shares the `digest` traits
# `sha2` above already brings in, so it adds no tree of its own.
sha1 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# Argon2id, for exactly one caller: the key that seals a chat's messages
# (`seal::derive`). It is the one place in this crate that turns a HUMAN PASSPHRASE into a
# key, and the ciphertext it protects is held for ever by the adversary it protects it from
# (the tenant), so the KDF has to be memory-hard — `sha2` and `hkdf` above are neither, and
# using either here would leave a weak passphrase open to an offline attack at GPU speed.
# RustCrypto, like `aes-gcm`, `hkdf` and `p256`: pure Rust, no system openssl, one small tree.
argon2 = "0.5"
# Local wall-clock time, for exactly one caller: the hours "Always available" keeps
# (`teams_presence::local_minute_of_day`). Everything else here is epoch ms or ISO-8601
# UTC and needs no calendar — but "green from 08:00 to 19:00" is the user's OWN morning,
# and resolving that means the machine's time zone with its DST rules. `clock` is the one
# feature asked for (no serde, no oldtime): a stored UTC offset would be an hour wrong for
# half the year, which is exactly the size of mistake that setting exists to avoid.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The IANA time-zone database, for the same one caller: the hours are the USER's own
# morning, and the user travels while the machine they run this on does not (see
# `teams_presence::minute_of_day`). `chrono::Local` answers only "this machine's zone",
# which is the wrong answer for somebody who set 08:00-19:00 in Paris and is now in Tokyo.
chrono-tz = "0.10"
# X11, for exactly one feature: bringing the identity broker's own sign-in window to the
# browser this app is read in (see SIGN-IN.md and `src/xwindow.rs`). The broker renders that
# window itself, in a WebKitGTK view on an X display, and no API redirects it — so reaching
# it means reading one window's pixels and sending keys and clicks back, which is `xtest`.
# Pure Rust, like `rustls` and `p256` above: the binary links no system Xlib and stays
# portable, and nothing here spawns `xdotool`, `scrot`, `x11vnc` or `websockify` — the four
# binaries the same job took by hand.
x11rb = { version = "0.13", features = ["xtest"] }
# The user's own Intune container, as a LIBRARY rather than as host commands (see
# `src/intune.rs`): where the identity broker's bus is, read from the container's own runtime
# state on every connection, and the broker repair's stop and start. It replaced `busctl`,
# `pgrep`, `systemctl` and the `intune-container` binary, which the shell side ran for all of it.
#
# PINNED TO A COMMIT, NOT TO crates.io 0.2.3, and that is load-bearing. 0.2.3 stamps the
# platform digest where it compares the index digest, so every start re-pulls the whole rootfs;
# and it does not persist /etc/microsoft/identity-broker across a pull, so that re-pull also
# erases the device registration ("Device is not registered"). A repair through 0.2.3 would
# unenroll the machine. 2917d92 fixed both, and master (7605004) is the code the user's own
# installed binary is built from, so the two agree on the state file, the lock and the config.
#
# The pin is the branch `fix/boot-without-a-user-manager` on top of that master (0f5fe0d). It
# adds what running the container INSIDE teams-lite's own image takes — a cgroup with no systemd
# user session (INTUNE_CONTAINER_CGROUP=own), the id range read from /etc/subuid, a recycled pid
# never read as the container, a clean PID 1 environment, a desktop-size 24-bit :99, and the
# portal opened on that display with no restart — and changes nothing a host install relies on:
# the state file only gains an optional field. Move to a release once one carries those commits.
#
# RSA signature VERIFICATION, for exactly one caller: the Claude Code installer checks Anthropic's
# detached signature over a release's manifest (see `src/openpgp.rs`, which reads the OpenPGP
# packets and leaves every piece of cryptography to this crate). RustCrypto, like `p256` and
# `aes-gcm` above: pure Rust, no system openssl. Only `sha2` is added, which is what lets a
# PKCS#1 v1.5 signature name its hash by OID; `pem` and the rest stay off.
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "u64_digit"] }
# The agent CLIs this app can install from Settings › AI providers (see `src/agent_cli.rs`). Claude
# Code ships each release as a zstd stream about a third of the binary's size, and opencode as a
# gzipped tarball holding one file. Both crates are already in the tree through `intune-container`,
# which unpacks its own image layers with them, so naming them here builds nothing new.
zstd = "0.13"
tar = { version = "0.4", default-features = false }
# Default features only: the crate's `gui` feature (tauri, WebKitGTK) stays off.
intune-container = { git = "https://github.com/magicabdel/intune-container", rev = "0f5fe0d7f94144e15127c2c38f519b2ff04d3cdd" }
# The crate logs through `tracing`, and without a subscriber every word it says is dropped —
# a failed container boot would leave nothing to read. Installed only in the processes that
# run the crate's lifecycle (`intune::dispatch_reexec`); the same version and feature the crate
# itself already compiles, so it adds nothing to the tree.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `test-util` is tokio's paused clock, and it is here for one rule: the agent stops a
# run that says nothing for half an hour (`agent::RUN_IDLE_TIMEOUT`). A test that waited
# for that in real time is a test nobody runs, so the two tests around it advance a
# virtual clock instead. Dev-only, so the shipped binary carries none of it.
tokio = { version = "1", features = ["test-util"] }
